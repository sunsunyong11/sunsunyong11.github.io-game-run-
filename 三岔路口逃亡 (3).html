<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>三岔路口逃亡·清晨树林版</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; }
html,body { width:100%; height:100%; overflow:hidden; background:#111; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
body { display:flex; justify-content:center; align-items:center; }

#gameWrap { position:relative; width:100vw; height:100vh; max-width:540px; max-height:960px; background:radial-gradient(ellipse at 50% 40%, #141e3a 0%, #0a0f1f 55%, #05070f 100%); overflow:hidden; }

/* ===== 主页 ===== */
#homeScreen {
  position:absolute; inset:0;
  background:linear-gradient(160deg,#2a2d35 0%,#1c1e24 100%);
  display:flex; flex-direction:column;
  padding:36px 24px 24px; z-index:10;
  overflow-y:auto;
}
.home-title { color:#fff; font-size:28px; font-weight:800; line-height:1.25; letter-spacing:1px; margin-bottom:16px; }
.home-sub { color:#9aa0aa; font-size:14px; line-height:1.7; margin-bottom:24px; }
.level-btn {
  background:rgba(255,255,255,0.1); border:none; border-radius:14px;
  color:#fff; font-size:18px; font-weight:600; padding:16px 16px; margin-bottom:12px;
  cursor:pointer; transition:all .15s; backdrop-filter:blur(4px);
}
.level-btn:active { background:rgba(255,255,255,0.22); transform:scale(0.97); }
.level-btn .num { display:inline-block; margin-right:8px; }

/* ===== 游戏 ===== */
#gameScreen { position:absolute; inset:0; display:none; }
#gameCanvas { position:absolute; inset:0; width:100%; height:100%; }

.top-ui {
  position:absolute; top:0; left:0; right:0; padding:36px 18px 0;
  display:flex; justify-content:space-between; z-index:5; pointer-events:none;
}
.hp-box, .monster-box { display:flex; flex-direction:column; }
.hp-label { color:#fff; font-size:18px; font-weight:700; margin-bottom:5px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
.hp-bar { width:180px; height:20px; background:rgba(255,255,255,0.15); border-radius:10px; overflow:hidden; }
.hp-fill { height:100%; width:100%; background:linear-gradient(90deg,#34d058,#5ce87a); border-radius:10px; transition:width .25s; }
.monster-label { color:#fff; font-size:18px; font-weight:700; margin-bottom:5px; text-align:right; text-shadow:0 1px 4px rgba(0,0,0,.6); }
.monster-bar { width:140px; height:20px; background:rgba(255,255,255,0.15); border-radius:10px; overflow:hidden; }
.monster-fill { height:100%; width:100%; background:linear-gradient(90deg,#888,#bbb); border-radius:10px; transition:width .3s; }

/* 糖果/速度状态栏 */
.status-bar {
  position:absolute; top:74px; left:50%; transform:translateX(-50%);
  display:flex; gap:14px; z-index:5; pointer-events:none;
}
.status-pill {
  background:rgba(0,0,0,0.45); border-radius:20px; padding:6px 14px;
  color:#fff; font-size:14px; font-weight:600;
  display:flex; align-items:center; gap:5px;
  backdrop-filter:blur(4px);
}

#backBtn {
  position:absolute; top:74px; left:14px; width:34px; height:34px;
  background:rgba(0,0,0,0.4); border:none; border-radius:50%; color:#fff; font-size:17px;
  z-index:6; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* ===== 摇杆 ===== */
#joystick {
  position:absolute; left:28px; bottom:36px; width:130px; height:130px;
  border-radius:50%; background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.15); z-index:6; touch-action:none;
}
#joystickKnob {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:56px; height:56px; border-radius:50%;
  background:rgba(255,255,255,0.25); border:2px solid rgba(255,255,255,0.35);
  pointer-events:none;
}

/* ===== 挥刀 ===== */
#attackBtn {
  position:absolute; right:28px; bottom:36px; width:118px; height:118px;
  border-radius:50%; background:radial-gradient(circle at 35% 30%,#e85a5a,#b83232);
  border:3px solid rgba(255,255,255,0.2); color:#fff; font-size:26px; font-weight:800;
  z-index:6; cursor:pointer; box-shadow:0 4px 20px rgba(184,50,50,0.5); transition:transform .1s;
}
#attackBtn:active { transform:scale(0.92); }
#attackBtn.cooldown { opacity:0.5; }

/* ===== 结算 ===== */
#resultScreen {
  position:absolute; inset:0; background:rgba(0,0,0,0.78);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:20; backdrop-filter:blur(6px);
}
.result-title { font-size:48px; font-weight:900; margin-bottom:16px; text-shadow:0 2px 12px rgba(0,0,0,.5); }
.result-title.win { color:#5ce87a; }
.result-title.lose { color:#e85a5a; }
.result-info { color:#ccc; font-size:17px; margin-bottom:8px; text-align:center; line-height:1.6; }
.result-btn {
  background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.25);
  border-radius:14px; color:#fff; font-size:19px; font-weight:600;
  padding:14px 36px; margin:8px; cursor:pointer;
}
.result-btn:active { background:rgba(255,255,255,0.22); }

@keyframes hurtFlash { 0%,100%{opacity:0;} 50%{opacity:0.4;} }
#hurtOverlay { position:absolute; inset:0; background:#ff0000; opacity:0; pointer-events:none; z-index:4; }
#hurtOverlay.flash { animation:hurtFlash .3s; }

@keyframes candyPop { 0%{transform:translate(-50%,-50%) scale(0.5);opacity:0;} 50%{transform:translate(-50%,-80%) scale(1.2);opacity:1;} 100%{transform:translate(-50%,-120%) scale(1);opacity:0;} }
.float-text {
  position:absolute; pointer-events:none; z-index:7; font-weight:800; font-size:18px;
  text-shadow:0 1px 4px rgba(0,0,0,.6); animation:candyPop .8s forwards;
}
</style>
</head>
<body>
<div id="gameWrap">

  <div id="homeScreen">
    <div class="home-title">三岔路口逃亡 · 清晨树林版</div>
    <div class="home-sub">
      无限大地图 | 3K基础移速<br>
      糖果永久叠加加速，越吃越强
    </div>
    <button class="level-btn" onclick="startGame(1)"><span class="num">①</span>破旧树林</button>
    <button class="level-btn" onclick="startGame(2)"><span class="num">②</span>清晨普通树林（亮青草园）</button>
    <button class="level-btn" onclick="startGame(3)"><span class="num">③</span>破旧装备房</button>
    <button class="level-btn" onclick="startGame(4)" style="background:rgba(255,60,60,0.18);border:1px solid rgba(255,80,80,0.3);"><span class="num">④</span>地狱难度（50怪）</button>
    <button class="level-btn" onclick="startGame(5)" style="background:rgba(180,40,255,0.2);border:1px solid rgba(180,80,255,0.35);"><span class="num">⑤</span>牛逼级难度（100怪）</button>
  </div>

  <div id="gameScreen">
    <canvas id="gameCanvas"></canvas>
    <div id="hurtOverlay"></div>

    <div class="top-ui">
      <div class="hp-box">
        <div class="hp-label" id="hpLabel">主角血量 100/100</div>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
      </div>
      <div class="monster-box">
        <div class="monster-label" id="monsterLabel">剩余怪物 0</div>
        <div class="monster-bar"><div class="monster-fill" id="monsterFill"></div></div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-pill">🍬 <span id="candyCount">0</span></div>
      <div class="status-pill">⚡ <span id="speedVal">3.5</span></div>
    </div>

    <button id="backBtn" onclick="backToHome()">←</button>
    <div id="joystick"><div id="joystickKnob"></div></div>
    <button id="attackBtn">挥刀</button>
  </div>

  <div id="resultScreen">
    <div class="result-title" id="resultTitle">胜利！</div>
    <div class="result-info" id="resultInfo"></div>
    <button class="result-btn" onclick="restartGame()">再来一局</button>
    <button class="result-btn" onclick="backToHome()">返回主页</button>
  </div>

</div>

<script>
// ============ 配置 ============
const LEVEL_CONFIG = {
  1: { name:'破旧树林', monsters:8, decor:['🌲','🪵','🌲','🪵','🌲','🌲'] },
  2: { name:'清晨普通树林', monsters:9, decor:['🍀','🌿','🌳','🍀','🌿','🌳'] },
  3: { name:'破旧装备房', monsters:10, decor:['📦','🪓','📦','🪓','📦','🪓'] },
  4: { name:'地狱难度', monsters:50, decor:['🔥','💀','🌋','☠️','🔥','💀'] },
  5: { name:'牛逼级难度', monsters:100, decor:['👹','💀','🔥','☠️','👺','🌋'] }
};
const MONSTER_TYPES = ['😈','👽'];
const PLAYER_EMOJI = '😭';
const CANDY_EMOJI = '🍬';

const MAX_HP = 100;
const PLAYER_DAMAGE = 3;        // 怪物碰玩家扣血
const MONSTER_MAX_HP = 100;     // 怪物血量
const ATTACK_DAMAGE = 10;       // 挥刀每次伤害
const BASE_SPEED = 3.5;
const SPEED_PER_CANDY = 0.5;
const MONSTER_SPEED = 1.3;
const ATTACK_RADIUS = 72;
const ATTACK_DURATION = 380;
const ATTACK_COOLDOWN = 0;     // 无冷却，支持连击
const HURT_INVINCIBLE = 800;
const CANDY_PICKUP_RADIUS = 26;

const CHUNK_SIZE = 420;
const CANDIES_PER_CHUNK = 2;
const DECOR_PER_CHUNK = 5;

// ============ 状态 ============
let canvas, ctx, W, H;
let currentLevel = 1;
let player, monsters, camera;
let eatenCandies = new Set();
let candyCount = 0;
let gameRunning = false, animId = null, lastTime = 0;

let joystick = { active:false, dx:0, dy:0, angle:0, magnitude:0 };
let joyCenter = { x:0, y:0 };
const JOY_MAX_R = 50;

let attacking = false, attackTimer = 0, attackCooldown = 0, attackHitSet = new Set();

// ============ 工具 ============
function hash2(x, y) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function hash3(x, y, z) {
  let h = (x|0)*374761393 + (y|0)*668265263 + (z|0)*2147483647;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

// ============ 初始化 ============
function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  setupJoystick();
  setupAttack();
}

function resize() {
  const wrap = document.getElementById('gameWrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W; canvas.height = H;
  const joyEl = document.getElementById('joystick');
  const r = joyEl.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  joyCenter.x = r.left - wr.left + r.width/2;
  joyCenter.y = r.top - wr.top + r.height/2;
}

// ============ 摇杆 ============
function setupJoystick() {
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('joystickKnob');
  function gp(e) {
    const t = e.touches ? e.touches[0] : e;
    const wr = document.getElementById('gameWrap').getBoundingClientRect();
    return { x:t.clientX - wr.left, y:t.clientY - wr.top };
  }
  function onStart(e) { e.preventDefault(); joystick.active=true; onMove(e); }
  function onMove(e) {
    if (!joystick.active) return; e.preventDefault();
    const p = gp(e);
    let dx = p.x - joyCenter.x, dy = p.y - joyCenter.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    if (d > JOY_MAX_R) { dx = dx/d*JOY_MAX_R; dy = dy/d*JOY_MAX_R; }
    joystick.dx=dx; joystick.dy=dy; joystick.magnitude=Math.min(d/JOY_MAX_R,1);
    joystick.angle=Math.atan2(dy,dx);
    knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function onEnd(e) {
    e.preventDefault();
    joystick.active=false; joystick.dx=0; joystick.dy=0; joystick.magnitude=0;
    knob.style.transform='translate(-50%,-50%)';
  }
  joy.addEventListener('touchstart',onStart,{passive:false});
  joy.addEventListener('touchmove',onMove,{passive:false});
  joy.addEventListener('touchend',onEnd,{passive:false});
  joy.addEventListener('touchcancel',onEnd,{passive:false});
  joy.addEventListener('mousedown',onStart);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
}

// ============ 挥刀 ============
function setupAttack() {
  const btn = document.getElementById('attackBtn');
  btn.addEventListener('touchstart',doAttack,{passive:false});
  btn.addEventListener('mousedown',doAttack);
}
function doAttack(e) {
  e.preventDefault();
  // 每次点击都触发一次新的挥刀，连击可叠加伤害
  attacking = true;
  attackTimer = ATTACK_DURATION;
  attackHitSet.clear();
}

// ============ 开始游戏 ============
function startGame(level) {
  currentLevel = level;
  const cfg = LEVEL_CONFIG[level];
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  document.getElementById('resultScreen').style.display='none';
  resize();

  player = { x:0, y:0, r:22, hp:MAX_HP, invincible:0, facing:0.3 };
  camera = { x:0, y:0 };
  candyCount = 0;
  eatenCandies.clear();

  // 怪物在玩家周围生成
  monsters = [];
  for (let i=0; i<cfg.monsters; i++) {
    const ang = (i / cfg.monsters) * Math.PI * 2 + Math.random()*0.5;
    const dist = 350 + Math.random()*250;
    monsters.push({
      x: Math.cos(ang)*dist,
      y: Math.sin(ang)*dist,
      r:18, hp:MONSTER_MAX_HP,
      type: MONSTER_TYPES[Math.floor(Math.random()*MONSTER_TYPES.length)],
      speed: MONSTER_SPEED*(0.85+Math.random()*0.4),
      wobble: Math.random()*Math.PI*2,
      hitFlash:0
    });
  }

  updateUI();
  gameRunning = true;
  attacking=false; attackTimer=0; attackCooldown=0; attackHitSet.clear();
  lastTime = performance.now();
  if (animId) cancelAnimationFrame(animId);
  gameLoop(lastTime);
}

// ============ 游戏循环 ============
function gameLoop(now) {
  if (!gameRunning) return;
  const dt = Math.min((now-lastTime)/16.67, 3);
  lastTime = now;
  update(dt);
  render();
  animId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  const spd = BASE_SPEED + candyCount * SPEED_PER_CANDY;

  // 玩家移动
  if (joystick.magnitude > 0.05) {
    player.x += Math.cos(joystick.angle) * spd * joystick.magnitude * dt;
    player.y += Math.sin(joystick.angle) * spd * joystick.magnitude * dt;
    player.facing = joystick.angle;
  }
  if (player.invincible > 0) player.invincible -= dt*16.67;

  // 相机跟随（平滑）
  camera.x += (player.x - camera.x) * 0.12 * dt;
  camera.y += (player.y - camera.y) * 0.12 * dt;

  // 挥刀
  if (attacking) {
    attackTimer -= dt*16.67;
    if (attackTimer <= 0) attacking=false;
  }
  if (attackCooldown > 0) attackCooldown -= dt*16.67;

  // 糖果拾取（检测玩家周围chunk）
  checkCandyPickup();

  // 怪物
  for (const m of monsters) {
    m.wobble += 0.05*dt;
    if (m.hitFlash > 0) m.hitFlash -= dt*16.67;
    const dx = player.x - m.x, dy = player.y - m.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist > 1) {
      m.x += (dx/dist)*m.speed*dt;
      m.y += (dy/dist)*m.speed*dt;
    }
    // 碰玩家
    const cDist = player.r + m.r - 10;
    if (dist < cDist && player.invincible <= 0) {
      player.hp -= PLAYER_DAMAGE;
      player.invincible = HURT_INVINCIBLE;
      player.x -= (dx/dist)*24;
      player.y -= (dy/dist)*24;
      flashHurt();
      updateUI();
      if (player.hp <= 0) { player.hp=0; endGame(false); return; }
    }
    // 挥刀伤害（无击退，怪物仍可靠近）
    if (attacking && !attackHitSet.has(m)) {
      const adx = m.x - player.x, ady = m.y - player.y;
      if (Math.sqrt(adx*adx+ady*ady) < ATTACK_RADIUS + m.r*0.5) {
        m.hp -= ATTACK_DAMAGE;
        m.hitFlash = 200;
        attackHitSet.add(m);
      }
    }
  }
  // 移除死亡怪物
  const before = monsters.length;
  monsters = monsters.filter(m => m.hp > 0);
  if (monsters.length !== before) updateUI();

  if (monsters.length === 0) endGame(true);
}

// ============ 糖果 ============
function checkCandyPickup() {
  const pcx = Math.floor(player.x / CHUNK_SIZE);
  const pcy = Math.floor(player.y / CHUNK_SIZE);
  for (let cx=pcx-1; cx<=pcx+1; cx++) {
    for (let cy=pcy-1; cy<=pcy+1; cy++) {
      for (let i=0; i<CANDIES_PER_CHUNK; i++) {
        const key = `${cx},${cy},${i}`;
        if (eatenCandies.has(key)) continue;
        const wx = cx*CHUNK_SIZE + hash3(cx,cy,i)*CHUNK_SIZE;
        const wy = cy*CHUNK_SIZE + hash3(cx,cy,i+100)*CHUNK_SIZE;
        const dx = wx-player.x, dy = wy-player.y;
        if (dx*dx+dy*dy < CANDY_PICKUP_RADIUS*CANDY_PICKUP_RADIUS) {
          eatenCandies.add(key);
          candyCount++;
          showFloatText(wx, wy, '+0.5⚡', '#ffd84a');
          updateUI();
        }
      }
    }
  }
}

function showFloatText(wx, wy, text, color) {
  const sx = wx - camera.x + W/2;
  const sy = wy - camera.y + H/2;
  const el = document.createElement('div');
  el.className = 'float-text';
  el.style.left = sx+'px';
  el.style.top = sy+'px';
  el.style.color = color;
  el.textContent = text;
  document.getElementById('gameScreen').appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

// ============ 渲染 ============
function render() {
  ctx.clearRect(0,0,W,H);
  // 蓝黑渐变底色
  const bg = ctx.createRadialGradient(W/2, H*0.4, 20, W/2, H*0.4, Math.max(W,H)*0.8);
  bg.addColorStop(0, '#162040');
  bg.addColorStop(0.5, '#0c1226');
  bg.addColorStop(1, '#05070f');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // 网格（偏蓝）
  ctx.strokeStyle = 'rgba(80,130,220,0.06)';
  ctx.lineWidth = 1;
  const gridSize = 100;
  const offX = -(camera.x % gridSize);
  const offY = -(camera.y % gridSize);
  for (let x=offX; x<W; x+=gridSize) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=offY; y<H; y+=gridSize) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  const cfg = LEVEL_CONFIG[currentLevel];
  const pcx = Math.floor(camera.x / CHUNK_SIZE);
  const pcy = Math.floor(camera.y / CHUNK_SIZE);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  // 装饰 + 糖果（只渲染附近chunk）
  for (let cx=pcx-2; cx<=pcx+2; cx++) {
    for (let cy=pcy-2; cy<=pcy+2; cy++) {
      // 装饰
      for (let i=0; i<DECOR_PER_CHUNK; i++) {
        const wx = cx*CHUNK_SIZE + hash3(cx,cy,i+200)*CHUNK_SIZE;
        const wy = cy*CHUNK_SIZE + hash3(cx,cy,i+300)*CHUNK_SIZE;
        const sx = wx-camera.x+W/2, sy = wy-camera.y+H/2;
        if (sx<-40||sx>W+40||sy<-40||sy>H+40) continue;
        const size = 14 + hash3(cx,cy,i+400)*14;
        const rot = hash3(cx,cy,i+500)*Math.PI*2;
        const emoji = cfg.decor[Math.floor(hash3(cx,cy,i+600)*cfg.decor.length)];
        ctx.save();
        ctx.translate(sx,sy); ctx.rotate(rot);
        ctx.globalAlpha = 0.55;
        ctx.font = `${size}px serif`;
        ctx.fillText(emoji,0,0);
        ctx.restore();
      }
      // 糖果
      for (let i=0; i<CANDIES_PER_CHUNK; i++) {
        const key = `${cx},${cy},${i}`;
        if (eatenCandies.has(key)) continue;
        const wx = cx*CHUNK_SIZE + hash3(cx,cy,i)*CHUNK_SIZE;
        const wy = cy*CHUNK_SIZE + hash3(cx,cy,i+100)*CHUNK_SIZE;
        const sx = wx-camera.x+W/2, sy = wy-camera.y+H/2;
        if (sx<-30||sx>W+30||sy<-30||sy>H+30) continue;
        const bob = Math.sin(performance.now()/300 + i + cx + cy)*2;
        // 光晕
        ctx.save();
        ctx.globalAlpha = 0.3;
        const g = ctx.createRadialGradient(sx,sy+bob,2,sx,sy+bob,16);
        g.addColorStop(0,'rgba(255,200,60,0.6)');
        g.addColorStop(1,'rgba(255,200,60,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(sx,sy+bob,16,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.font='20px serif';
        ctx.fillText(CANDY_EMOJI, sx, sy+bob);
      }
    }
  }
  ctx.globalAlpha=1;

  // 挥刀蓝色区域
  if (attacking) {
    const px = player.x-camera.x+W/2, py = player.y-camera.y+H/2;
    const prog = attackTimer/ATTACK_DURATION;
    ctx.save();
    ctx.globalAlpha = 0.4*prog;
    const grad = ctx.createRadialGradient(px,py,8,px,py,ATTACK_RADIUS);
    grad.addColorStop(0,'rgba(120,200,255,0.7)');
    grad.addColorStop(0.65,'rgba(60,130,255,0.45)');
    grad.addColorStop(1,'rgba(30,80,200,0.1)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(px,py,ATTACK_RADIUS,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.8*prog;
    ctx.strokeStyle='#7cc0ff'; ctx.lineWidth=3;
    ctx.stroke();
    // 旋转刀光
    ctx.globalAlpha=0.5*prog;
    ctx.strokeStyle='#aaddff'; ctx.lineWidth=2;
    const sweep = (1-prog)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(px,py,ATTACK_RADIUS*0.85, player.facing-0.8+sweep, player.facing+0.8+sweep);
    ctx.stroke();
    ctx.restore();
  }

  // 怪物
  for (const m of monsters) {
    const sx = m.x-camera.x+W/2, sy = m.y-camera.y+H/2;
    if (sx<-80||sx>W+80||sy<-80||sy>H+80) continue;
    const bob = Math.sin(m.wobble)*2;
    // 血条
    const bw=30, bh=4;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(sx-bw/2-1, sy-m.r-10-1, bw+2, bh+2);
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.fillRect(sx-bw/2, sy-m.r-10, bw, bh);
    const hpRatio = m.hp/MONSTER_MAX_HP;
    ctx.fillStyle = hpRatio>0.5?'#5ce87a':(hpRatio>0.25?'#ffc04a':'#ff5a5a');
    ctx.fillRect(sx-bw/2, sy-m.r-10, bw*hpRatio, bh);
    // 怪物
    ctx.save();
    if (m.hitFlash > 0) {
      ctx.globalAlpha = 0.5+0.5*Math.sin(m.hitFlash/30);
    }
    ctx.font=`${m.r*1.5}px serif`;
    ctx.fillText(m.type, sx, sy+bob);
    ctx.restore();
  }

  // 玩家
  const px = player.x-camera.x+W/2, py = player.y-camera.y+H/2;
  ctx.save();
  if (player.invincible>0 && Math.floor(player.invincible/80)%2===0) ctx.globalAlpha=0.4;
  ctx.font=`${player.r*1.7}px serif`;
  ctx.fillText(PLAYER_EMOJI, px, py);
  // 菜刀
  ctx.save();
  ctx.translate(px+Math.cos(player.facing)*18, py+Math.sin(player.facing)*18+6);
  ctx.rotate(player.facing+0.5);
  ctx.font=`${player.r*0.85}px serif`;
  ctx.fillText('🔪',0,0);
  ctx.restore();
  ctx.restore();
}

// ============ UI ============
function updateUI() {
  const hp = Math.max(0, player.hp);
  document.getElementById('hpLabel').textContent = `主角血量 ${hp}/${MAX_HP}`;
  document.getElementById('hpFill').style.width = (hp/MAX_HP*100)+'%';
  const cfg = LEVEL_CONFIG[currentLevel];
  document.getElementById('monsterLabel').textContent = `剩余怪物 ${monsters.length}`;
  document.getElementById('monsterFill').style.width = (monsters.length/cfg.monsters*100)+'%';
  document.getElementById('candyCount').textContent = candyCount;
  document.getElementById('speedVal').textContent = (BASE_SPEED + candyCount*SPEED_PER_CANDY).toFixed(1);
}

function flashHurt() {
  const el = document.getElementById('hurtOverlay');
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

// ============ 结算 ============
function endGame(win) {
  gameRunning=false;
  if (animId) cancelAnimationFrame(animId);
  const title=document.getElementById('resultTitle'), info=document.getElementById('resultInfo');
  const cfg=LEVEL_CONFIG[currentLevel];
  if (win) {
    title.textContent='🎉 胜利！'; title.className='result-title win';
    info.innerHTML=`通关「${cfg.name}」<br>消灭 ${cfg.monsters} 个怪物 · 收集 🍬${candyCount} 颗 · 最终速度 ${(BASE_SPEED+candyCount*SPEED_PER_CANDY).toFixed(1)}`;
  } else {
    title.textContent='💀 失败'; title.className='result-title lose';
    info.innerHTML=`被怪物打倒了…<br>还剩 ${monsters.length} 个怪物 · 收集 🍬${candyCount} 颗`;
  }
  document.getElementById('resultScreen').style.display='flex';
}

function restartGame() { startGame(currentLevel); }
function backToHome() {
  gameRunning=false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('homeScreen').style.display='flex';
}

init();
</script>
</body>
</html>
