<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人信息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d0d1a;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.box{background:#1a1a2e;border-radius:16px;padding:32px 24px;width:100%;max-width:320px;text-align:center}
h1{font-size:18px;font-weight:600;margin-bottom:8px}
.sub{color:#888;font-size:13px;margin-bottom:24px}
input{width:100%;padding:12px 16px;border:1px solid #333;border-radius:8px;background:#0d0d1a;color:#eee;font-size:16px;text-align:center;outline:none;letter-spacing:4px}
input:focus{border-color:#e94560}
button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;background:#e94560;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:active{opacity:0.8}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:#e94560;font-size:13px;margin-top:12px;display:none}
.loading{width:40px;height:40px;border:4px solid #333;border-top-color:#e94560;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{color:#888;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <h1>个人信息</h1>
  <p class="sub">请输入提取码查看（AES-256-GCM · PBKDF2 5000 万次）</p>
  <div id="inputArea">
    <input type="password" id="code" placeholder="提取码" maxlength="32">
    <button id="btn" onclick="checkCode()">确认</button>
    <p class="error" id="err">提取码错误，请重试</p>
  </div>
  <div class="loading" id="loading" style="display:none"></div>
  <p class="lock" id="locktip" style="display:none">正在解密，请稍候…</p>
  <p class="lock">端到端加密 · 密码不出本机</p>
</div>
<script>
var PLAYER_URL = "https://sunsunyong11.github.io/sunsunyong11.github.io-game-run-/";

var SALT_B64 = "LQT3c4MTb4PF8tXBhHQtBA==";
var IV_B64   = "rr/C/khconsBUUdR";
var CT_B64   = "aeNNNGYhy27hiufdyAX3Mh6pMCx7nzNbq0pmsogsIQ5GZyKFUkCzzAbB8M6b8FDRWAXlioeySxPaHOI0C+yXLhWYyj8eoeGSyjNQaAezFwGBKN4j/qjLxgpElSCeFLBlcmUudrS+O2WUeFVdxjh7yrx/FqatExycCVM8rLoLuCVQh/r0bG4AbsbW5SF2TlIzt7FveHf1PJOzbdyG4kWXvvVADyw/dCEIYdTGSEr5bV9gyQV71NY02UJQX3NhS/qbihETKNM0gGwvX9YQQ3rrPf3vOenr1XSuWSypiNVsMeZCAP1jlQ==";
var ITER = 50000000;

function b64ToBytes(b64){
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}

async function checkCode() {
  var input = document.getElementById('code');
  var btn = document.getElementById('btn');
  var val = input.value.trim();
  if (!val) return;
  document.getElementById('err').style.display = 'none';
  btn.disabled = true;
  btn.textContent = '解密中…';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('locktip').style.display = 'block';
  try {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(val), {name:'PBKDF2'}, false, ['deriveKey']
    );
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64ToBytes(SALT_B64), iterations:ITER, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    var plain = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b64ToBytes(IV_B64)}, key, b64ToBytes(CT_B64)
    );
    var data = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('locktip').textContent = '正在跳转播放器…';
    var hash = "#pdf=" + encodeURIComponent(data.pdf)
      + "&pptx=" + encodeURIComponent(data.pptx)
      + "&title=" + encodeURIComponent(data.title);
    location.replace(PLAYER_URL + hash);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('locktip').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    btn.disabled = false;
    btn.textContent = '确认';
    input.focus();
  }
}

document.getElementById('code').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkCode();
});
</script>
</body>
</html>
